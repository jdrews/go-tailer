name: Build/Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Compiles the platform-specific files (*_windows.go, *_darwin.go) that are
  # never built by a single-OS test run. A dependabot bump that breaks one of
  # these files must fail here.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Golang with cache
        # Official action with built-in module caching (cache: golang); pinned
        # to a full commit SHA, not a mutable tag.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Cross-compile (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build ./...

      - name: Cross-compile (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build ./...

      - name: Cross-compile (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build ./...

  build-test:
    needs: cross-compile
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep running the other OSes when one fails, so a single flake does not
      # hide the results of the remaining platforms.
      fail-fast: false
      matrix:
        include:
          # -race only on Linux: the race detector is not available on all
          # supported platforms, and the Linux suite exercises the same code
          # paths (inotify, polling, line buffer, webhook) as the other OSes.
          - os: ubuntu-latest
            test: go test -race ./...
          - os: windows-latest
            test: go test ./...
          - os: macos-latest
            test: go test ./...
    steps:
      - uses: actions/checkout@v3

      - name: Setup Golang with cache
        # Official action with built-in module caching (cache: golang); pinned
        # to a full commit SHA, not a mutable tag.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # The test command is passed via an environment variable instead of
        # expanding a context expression in run:, to avoid the GitHub Actions
        # script injection pattern (GH24).
        env:
          TEST_CMD: ${{ matrix.test }}
        run: $TEST_CMD
